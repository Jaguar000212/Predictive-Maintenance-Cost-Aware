[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-cost-aware"
version = "0.1.0"
description = "Cost-aware evaluation of ensemble models for industrial predictive maintenance"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
