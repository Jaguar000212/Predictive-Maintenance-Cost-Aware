# Week 1 gate: harness validation, not a model.
#
# A constant-negative baseline must produce recall 0 and PR-AUC = Brier = the
# positive base rate (0.0339). Anything else means the harness is broken rather
# than the model being poor. No real model is trained until this passes.
#
# Run:  python scripts/run_experiment.py configs/dummy.yaml

name: dummy_constant_negative
estimator: dummy_constant_negative

seeds: [0, 1, 2, 3, 4]

cv:
  n_splits: 5
  n_repeats: 5
  random_state: 42
  shuffle: true

metrics:
  beta: 2.0
  report_threshold: 0.5

# Cost constants: missed_failure:false_alarm:inspection = 10:1:0.5 (default,
# docs/DECISIONS.md D11 -- a literature-based ratio, chosen before any cost
# figure existed, not tuned to a result). Override per-config only with a
# recorded reason.
